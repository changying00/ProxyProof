name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} · redis ${{ matrix.redis }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # README 写的是 Python >= 3.9、Redis >= 5.0，矩阵就是这两句话的依据
        include:
          - python: '3.9'
            redis: '7'
            os: ubuntu-24.04    # ubuntu-latest（26.04）的镜像里已经没有 3.9，这个版本钉在 24.04 上验证
          - python: '3.12'
            redis: '7'
            os: ubuntu-latest
          - python: '3.12'
            redis: '5'
            os: ubuntu-latest
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install "ruff==0.17.6" pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
