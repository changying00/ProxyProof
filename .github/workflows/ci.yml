name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} · redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README 写的是 Python >= 3.9、Redis >= 5.0，矩阵就是这两句话的依据
        python: ['3.9', '3.12']
        redis: ['7']
        include:
          - python: '3.12'
            redis: '5'
    services:
      redis:
        image: redis:${{ matrix.redis }}-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install "ruff==0.17.6" pytest
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
